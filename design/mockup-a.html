    <aside class="panel knowledge" aria-label="课程知识和步骤讲解">
      <header class="panel-head"><h2>课程知识卡</h2><small>DNS / 05</small></header>
      <section><h3>域名系统</h3><p>DNS 将域名映射为地址。客户端只向递归解析器提问，解析器没有缓存时再向根、顶级域和权威服务器逐站查找。答案可按 TTL 缓存。</p>
        <dl class="facts"><div><dt>所在层</dt><dd>应用层（第 7 层）</dd></div><div><dt>端口</dt><dd>53 / UDP、TCP</dd></div><div><dt>关键概念</dt><dd>递归、迭代、引荐、缓存</dd></div><div><dt>规范</dt><dd>RFC 1034、RFC 1035</dd></div></dl>
      </section>
      <section aria-live="polite" aria-atomic="true"><span class="stamp" id="step-stamp"></span><h3 id="step-title"></h3><p id="step-text"></p><dl id="step-facts" class="facts"></dl><p id="step-route"></p></section>
    </aside>
