.app{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr)}.top{min-height:61px;padding:8px 13px;display:flex;align-items:center;gap:15px;border-bottom:1px solid var(--line);background:var(--bar)}.brand{display:flex;gap:8px;align-items:center;margin-right:auto;white-space:nowrap}.brand-mark{display:grid;place-items:center;width:35px;height:35px;border:1px solid var(--accent);color:var(--accent);font:800 13px var(--mono)}h1{font-size:16px;line-height:1.2}.brand small{color:var(--muted);font:10px var(--mono)}.osi{display:flex;align-items:center;gap:4px;white-space:nowrap;font:12px var(--mono)}.osi span{margin-right:4px;color:var(--muted)}.osi button{min-width:25px;padding:3px}.search{width:min(23vw,232px);min-width:0;padding:5px 8px;background:var(--panel);border:1px solid var(--line);border-radius:3px}.tools{display:flex;gap:5px;white-space:nowrap}.drawer-open{display:none}
.grid{min-height:0;display:grid;grid-template-columns:clamp(217px,19vw,290px) minmax(0,1fr) clamp(205px,18vw,270px);grid-template-rows:minmax(0,1fr) min(25.5vh,235px);grid-template-areas:"side stage knowledge" "side flow flow";gap:8px;padding:8px 10px 10px}.panel{min-width:0;min-height:0;border:1px solid var(--line);background:var(--panel);box-shadow:0 1px 2px var(--shadow)}.side{grid-area:side;overflow:auto}.stage{grid-area:stage;display:flex;flex-direction:column}.knowledge{grid-area:knowledge;overflow:auto}.flow{grid-area:flow;display:flex;flex-direction:column}.wide .grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"stage" "flow"}.wide .side,.wide .knowledge{display:none}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:7px;min-height:36px;padding:6px 10px;background:var(--bar);border-bottom:1px solid var(--line)}.panel-head small{color:var(--muted);font:11px var(--mono)}.catalog{padding:8px 7px}.filter{display:flex;flex-wrap:wrap;gap:3px;padding:0 0 7px}.filter button{font-size:11px;padding:3px 4px}.courses,.steps{list-style:none;padding:0}.course{border-top:1px solid var(--line)}.course-title{display:flex;align-items:center;gap:8px;min-height:43px;padding:5px 7px;width:100%;text-align:left;background:none;border:0;border-radius:0}.course-title b{font:750 13px var(--mono);display:block}.course-title small{display:block;font-size:11px;color:var(--muted)}.course-title .course-symbol{font:12px var(--mono);color:var(--muted)}.course-title .chevron{margin-left:auto}.course-title.dns{border-left:3px solid var(--accent);padding-left:4px;background:var(--selected)}.steps{padding:4px 2px 7px 19px}.steps button{width:100%;display:flex;text-align:left;align-items:center;gap:7px;border:0;background:none;font-size:12px;padding:4px}.steps button[aria-current=step]{color:var(--accent);background:var(--selected);font-weight:750}.step-num{display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;min-width:19px;height:19px;font:11px var(--mono)}.steps [aria-current] .step-num{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.empty{padding:8px;color:var(--muted)}
.views{display:flex;gap:3px;white-space:nowrap}.views button{padding:2px 7px}.stage-status{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.canvas{flex:1;min-height:0;background:linear-gradient(0deg,var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),var(--stage);background-size:21px 21px;display:grid;place-items:center}.canvas svg{display:block;width:100%;height:100%;min-height:0}.node{color:var(--ink)}.node text{fill:currentColor;text-anchor:middle;font-size:18px;font-weight:750}.node .address{font:13px var(--mono);fill:var(--muted)}.node.active text{fill:var(--accent)}.wire{fill:none;stroke:var(--path);stroke-width:1.7;stroke-dasharray:4 6}.wire.active{stroke:var(--route);stroke-width:3;stroke-dasharray:none}.ground{fill:var(--shadow)}.packet{cursor:pointer}.packet rect{fill:var(--accent);stroke:var(--panel);stroke-width:2}.packet text{fill:var(--accent-ink);font:700 13px var(--mono);text-anchor:middle;pointer-events:none}.packet:focus-visible rect{stroke:var(--focus);stroke-width:4}.legend{padding:5px 10px;border-top:1px solid var(--line);font:11px var(--mono);color:var(--muted)}.legend b{color:var(--route)}
.knowledge section{padding:10px 11px;border-bottom:1px solid var(--line)}.knowledge h3{margin-bottom:4px}.knowledge p{color:var(--muted)}.facts{margin-top:7px}.facts div{display:grid;grid-template-columns:58px 1fr;gap:4px;border-top:1px solid var(--line);padding:4px 0;font-size:12px}.facts dt{font-weight:700}.facts dd{color:var(--muted)}.stamp{display:inline-block;margin-bottom:5px;color:var(--accent);font:750 11px var(--mono)}#step-route{margin-top:8px;font:11px var(--mono);color:var(--amber)}
.playback{display:flex;flex-wrap:wrap;align-items:center;gap:4px}.playback button{white-space:nowrap;font-size:12px;min-height:27px}.playback select{height:27px;border:1px solid var(--line);border-radius:3px;background:var(--panel);font:12px var(--mono)}.log{overflow:auto;flex:1}table{width:100%;border-collapse:collapse;text-align:left;font:11px var(--mono);white-space:nowrap}th,td{padding:3px 6px;border-bottom:1px solid var(--line)}thead{position:sticky;top:0;background:var(--panel);z-index:1}tbody tr{cursor:pointer}tbody tr:hover,tbody tr.current{background:var(--selected)}tbody tr.current td:first-child{box-shadow:inset 3px 0 var(--accent)}tbody tr.future{color:var(--muted)}tbody button{border:0;background:none;padding:0;min-width:19px;font-family:var(--mono)}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ip);margin-right:5px}.dot.referral{background:var(--udp)}.dot.answer{background:var(--dns)}
.packet-view{flex:1;min-height:0;display:flex;flex-direction:column}.frame-head{padding:6px 10px;font:11px var(--mono);color:var(--muted)}.layers{display:flex;gap:3px;padding:0 9px 7px}.layers button{min-width:0;text-align:left;padding:3px 3px;font:11px var(--mono);border:0;border-top:4px solid var(--layer);background:var(--bar);overflow:hidden}.layers button:hover{background:var(--selected)}.inspector{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);flex:1;min-height:0;border-top:1px solid var(--line)}.fields{overflow:auto;border-right:1px solid var(--line);min-width:0}.fields h3{padding:4px 8px;background:var(--bar);border-left:4px solid var(--layer);font:750 11px var(--mono)}.field{display:grid;grid-template-columns:minmax(68px,.8fr) minmax(0,1fr);gap:1px 5px;text-align:left;border:0;border-radius:0;width:100%;padding:4px 8px;font-size:11px}.field code{overflow-wrap:anywhere;color:var(--accent)}.field small{font-size:10px;color:var(--muted);grid-column:2}.field.selected{background:var(--selected);box-shadow:inset 3px 0 var(--accent)}.dump{overflow:auto;color:var(--accent);padding:7px 5px;font:clamp(9px,.83vw,12px)/1.7 var(--mono)}.dump-line{display:grid;grid-template-columns:4ch 25ch 8ch;gap:.5ch;min-width:max-content}.offset{color:var(--muted)}.byte{display:inline-block;text-align:center;width:3ch}.ascii .byte{width:1ch}.byte.selected{background:var(--accent);color:var(--accent-ink)}
dialog{color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:0;width:min(330px,calc(100vw - 30px));max-height:88dvh;margin:8px auto auto 8px}dialog::backdrop{background:#0009}
.log{position:relative}.osi .course-level{border-color:var(--accent);color:var(--accent);font-weight:750}.dump{font-size:10px}.layers b,.layers small{display:block;white-space:nowrap}.layers small{color:var(--muted);font-size:10px}
@media(max-width:1050px){.top{gap:8px}.grid{grid-template-columns:202px minmax(0,1fr) 185px}.search{width:17vw}.osi span{display:none}}
@media(max-width:760px){.app{height:auto}.top{flex-wrap:wrap;gap:5px 8px;padding:7px 9px}.brand{flex:1}.brand-mark{width:28px;height:29px}.brand small{font-size:9px}h1{font-size:14px}.search{width:119px;font-size:12px}.osi{order:3;flex:1}.osi button{min-width:23px;padding:2px}.tools{order:4}.tools button{font-size:11px;padding:3px 5px}.drawer-open{display:inline-block}.grid,.wide .grid{grid-template-columns:minmax(0,1fr);grid-template-rows:auto;grid-template-areas:"stage" "knowledge" "flow";gap:7px;padding:7px}.side{display:none}.canvas{height:274px;flex:none}.knowledge section{padding:7px 9px}.knowledge .facts{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}.flow{min-height:215px}.log{max-height:231px}.playback{justify-content:flex-end}.playback button{font-size:11px;padding:3px 5px}.flow .panel-head{align-items:start}.flow h2{white-space:nowrap}.packet-view{min-height:0}.inspector{height:291px;flex:none;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.dump{font-size:9px}.field{grid-template-columns:1fr}.field small{grid-column:1}.layers button{font-size:10px}.stage-status{font-size:10px!important}.wide .knowledge{display:none}}
@media(max-width:760px){.dump-line{grid-template-columns:4ch 17ch 5ch}.node text{font-size:23px}.node .address{font-size:16px}}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand"><span class="brand-mark" aria-hidden="true">PM</span><div><h1>数据包博物馆</h1><small>PACKET MUSEUM · 馆藏工作台</small></div></div>
    <div class="osi" id="osi" aria-label="OSI 层级筛选"><span>OSI</span></div>
    <input class="search" id="search" type="search" aria-label="搜索协议" placeholder="搜索协议">
    <div class="tools"><button class="drawer-open" id="open-catalog">目录</button><button id="layout" title="切换专注布局" aria-label="专注布局" aria-pressed="false">▣ 布局</button><button id="theme" title="切换明暗主题" aria-label="切换主题">◐ 主题</button></div>

  <main class="grid">

            <radialGradient id="glass"><stop style="stop-color:var(--tube)"/><stop offset="1" style="stop-color:var(--screen)"/></radialGradient>
            <pattern id="raster" width="3" height="3" patternUnits="userSpaceOnUse"><path d="M0 2h3" stroke="#151b16" opacity=".65"/></pattern>

              <g transform="matrix(1 .5 0 1 19 -102)"><rect width="29" height="77" rx="1" fill="url(#plastic)"/><path d="M4 6h21v8H4zm0 12h21v8H4z" fill="#74684f"/><path d="M7 10h15m-15 12h13m-13 17h15m-15 4h15m-15 4h15m-15 4h15" stroke="#514534"/><rect x="5" y="62" width="8" height="6" rx="1" fill="#7b6a4b"/><circle cx="22" cy="65" r="1.7" fill="#91c575"/></g>

              <g transform="matrix(1 .5 0 1 -40 -33)"><rect width="48" height="18" rx="1" fill="url(#plastic)"/><rect x="5" y="5" width="21" height="8" rx="1" fill="#4f4b39"/><path d="M30 8h13m-13 3h13" stroke-dasharray="1 2"/><circle cx="10" cy="9" r="1.6" fill="#98c97d"/><circle cx="16" cy="9" r="1.4" fill="#dcb670"/></g>
